
name: Build iDex IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: xcode-27

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Check Xcode
        run: xcodebuild -version

      - name: Build iDex
        run: |
          xcodebuild \
            -project iDex.xcodeproj \
            -scheme iDex \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          APP=$(find build/Build/Products/Release-iphoneos \
            -maxdepth 1 -name '*.app' -type d | head -1)
          test -n "$APP"
          cp -R "$APP" Payload/
          zip -qry iDex-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: iDex-IPA
          path: iDex-unsigned.ipa
